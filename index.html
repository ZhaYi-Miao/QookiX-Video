<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QookiX Launcher · 安卓版宣传片 (1920×1080)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --cream:#FAF8F5; --caramel:#C98858; --caramel-l:#E3B18A; --caramel-d:#A96A3D;
    --ink:#3E2C20; --ink-2:#7A6455; --muted:#C9B6A5; --line:#E8DCCF;
    --cloth-a:#E19859; --cloth-b:#f4efe6;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--cream);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;}
  /* 用 flex 居中而不是 grid：grid 的隐式轨道会被 1920×1080 的 item 撑成同样大小，
     于是 place-items:center 变成空操作，缩小窗口时舞台会被顶到左上角、
     再按自身中心缩放，结果整体偏右下并被裁掉。flex 的居中是「不安全」的，
     即使 item 大于容器也会真的居中（负偏移），缩放到任意窗口都严丝合缝居中。 */
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--cream)}
  #camera{position:relative;flex:none;width:1920px;height:1080px;transform-origin:center center;will-change:transform}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--cream);transform-origin:center center;will-change:transform}
  .bg-warm{position:absolute;inset:0;background:var(--cream)}
  /* ===== 背景：橙白格子桌布，x/y 同步斜向滚动 =====
     复刻安卓端 AboutShowcase.vue 的 drawTablecloth()：46px 格子、
     CLOTH_A 木色 / CLOTH_B 暖米白棋盘交替，位移取 46 的整数倍（30 格）保证无缝。
     用 conic-gradient 一个盒子切出 4 象限，不要用 45deg linear-gradient ——
     后者色块边界是斜的，拼不出干净方格，格子上会漏出斜线接缝。
     时长 47.55s 与主时间轴一致，循环时天然同步。 */
  .bg-cloth{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.18;
    background-image:conic-gradient(from 0deg,
      var(--cloth-a) 0 25%, var(--cloth-b) 25% 50%,
      var(--cloth-a) 50% 75%, var(--cloth-b) 75% 100%);
    background-size:92px 92px;
    animation:clothRoll 51.55s linear infinite}
  @keyframes clothRoll{
    from{background-position:0 0}
    to  {background-position:1380px 1380px}}
  #heroLogo{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;
    z-index:30;opacity:0;will-change:transform,opacity}
  .logo-box{position:relative;width:100%;height:100%}
  .logo-box img{display:block;width:100%;height:100%;object-fit:contain}
  .logo-box.missing img{display:none}
  .ph-cookie{display:none;position:absolute;inset:0;
    background:linear-gradient(158deg,#F0C285,#D2914E 52%,#B4762F)}
  .logo-box.missing .ph-cookie{display:block}
  .ph-cookie i{position:absolute;width:14%;height:14%;border-radius:28%;background:#59371A;box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
  #brand{position:absolute;left:848px;top:506px;height:68px;display:flex;align-items:center;z-index:29;opacity:0;
    transform-origin:left center;will-change:transform,opacity}
  #brandName{font-size:34px;font-weight:800;letter-spacing:.01em;color:var(--ink)}
  /* 追加在名字后面的平台后缀（Android）：从名字背后滑出 */
  #brandAppend{position:relative;z-index:-1;font-size:34px;font-weight:800;letter-spacing:.01em;
    color:var(--caramel);opacity:0;will-change:transform,opacity}
  /* 副标题「更新速览」：位于图标与产品名之下、整体居中，层级在二者之后（从背后向下滑出） */
  #brandSub{position:absolute;left:0;width:1920px;top:652px;text-align:center;z-index:28;opacity:0;
    font-size:26px;font-weight:700;letter-spacing:.34em;text-indent:.34em;color:var(--caramel);
    transform-origin:center center;will-change:transform,opacity}
  #panels{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:20;pointer-events:none}
  .panel{position:absolute;left:104px;top:0;width:460px;height:1080px;
    display:flex;flex-direction:column;justify-content:flex-start;padding-top:300px;opacity:0;will-change:transform,opacity}
  .p-title{margin:0;font-size:104px;font-weight:900;line-height:1.04;letter-spacing:.02em;color:var(--ink)}
  .p-list{list-style:none;margin:46px 0 0 0;padding:0}
  .p-list .item{position:relative;display:flex;align-items:center;height:76px;
    font-size:44px;font-weight:800;letter-spacing:.02em;color:var(--muted);
    transform-origin:left center;opacity:.42;filter:blur(1.2px);will-change:transform,opacity,filter}
  /* 初始形态与 JS 里的 SIZE_PHONE_TALL 保持一致；改成横屏时两处都要改 */
  #screen{position:absolute;left:658px;top:287px;width:1105px;height:506px;z-index:10;opacity:0;transform-origin:center center;will-change:transform,opacity}
  .screen-card{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;
    background:#0d1117;
    border:10px solid #241C16;box-shadow:none}
  .shot{position:absolute;opacity:0;will-change:transform,opacity;
    background-position:center center;background-size:cover;background-repeat:no-repeat}
  .shot.desktop{inset:0}
  .shot.phone{inset:0;z-index:3}
  .shot img{display:block;width:100%;height:100%;object-fit:fill}
  .shot.scroll{background:#0d1117}
  .shot.scroll img{height:auto;width:100%;object-fit:initial;transform:none}
  .shot.missing img{display:none}
  .ph{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(150deg,#241C16 0%,#1C1510 58%,#171109 100%)}
  .shot.missing .ph{display:flex}
  .ph-skel{width:56%;height:46%;position:relative;border-radius:14px;background:#2A211A;border:1px solid rgba(240,194,133,.18);
    box-shadow:0 14px 34px rgba(0,0,0,.30);overflow:hidden}
  .ph-skel::before{content:"";position:absolute;left:0;top:0;width:26%;height:100%;background:#332820;border-right:1px solid rgba(240,194,133,.14)}
  .ph-skel::after{content:"";position:absolute;left:33%;top:16%;width:56%;height:9%;border-radius:8px;background:#4A3A2C;
    box-shadow:0 32px 0 #443528, 0 64px 0 #3E3125, 0 96px 0 #382C21}
  .ph-name{font-size:19px;font-weight:800;color:#F0C285;letter-spacing:.04em}
  .ph-desc{font-size:15px;font-weight:600;color:#C9B39B;opacity:.75;letter-spacing:.14em}
  #tMask{position:absolute;top:-12%;height:124%;width:34%;left:-42%;
    background:linear-gradient(90deg, rgba(201,136,88,0), rgba(201,136,88,.55) 50%, rgba(201,136,88,0));
    transform:skewX(-20deg);transform-origin:center;opacity:0;pointer-events:none;z-index:9;will-change:left,opacity}
  /* 注释气泡：标注开源地址与协议 */
  .annot{position:absolute;left:36px;top:32px;z-index:12;opacity:0;display:flex;align-items:center;gap:16px;white-space:nowrap;
    background:rgba(255,253,250,.95);backdrop-filter:blur(6px);
    border:1px solid rgba(180,140,105,.22);border-left:5px solid var(--caramel);
    border-radius:99px;padding:13px 26px;box-shadow:0 14px 36px rgba(120,80,50,.18);
    will-change:transform,opacity}
  .annot-h{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--ink-2)}
  .annot-url{font-size:23px;font-weight:800;color:var(--caramel-d);text-decoration:none;line-height:1}
  .annot-lic{flex:none;font-size:17px;font-weight:800;letter-spacing:.08em;
    color:#FFF9F4;background:linear-gradient(180deg,#D3955F,#C98858);padding:7px 18px;border-radius:99px}
  #sweep{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
  .sw{position:absolute;top:-14%;height:128%;width:80%;transform:skewX(-20deg) translateX(-3400px)}
  .sw:nth-child(1){left:-16%;background:#C98858}
  .sw:nth-child(2){left:8%;background:#E3B18A}
  .sw:nth-child(3){left:32%;background:#D89A6C}
  #outro{position:absolute;inset:0;z-index:35;pointer-events:none}
  #outroCols{position:absolute;left:0;top:290px;width:1920px;display:flex;justify-content:center;align-items:flex-start;gap:150px}
  #outroText{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding-top:44px}
  .o-line{font-size:100px;font-weight:900;line-height:1.14;letter-spacing:.06em;color:var(--ink);opacity:0}
  #o2{color:var(--caramel)}
  #oRepos{display:flex;flex-direction:column;gap:20px;opacity:0;will-change:transform,opacity}
  .o-repo{display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;
    background:rgba(255,253,250,.82);border:1px solid rgba(180,140,105,.2);border-radius:24px;
    padding:9px 24px 10px;box-shadow:0 10px 26px rgba(120,80,50,.10)}
  .o-main{display:flex;align-items:center;gap:16px;white-space:nowrap}
  .o-ver{font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;overflow:hidden}
  .o-tag{flex:none;font-size:17px;font-weight:800;letter-spacing:.06em;color:#FFF9F4;
    background:linear-gradient(180deg,#D3955F,#C98858);padding:7px 18px;border-radius:99px}
  .o-repo a{font-size:23px;font-weight:800;color:var(--caramel-d);text-decoration:none;line-height:1.2}
  .o-lic{flex:none;font-size:17px;font-weight:800;letter-spacing:.06em;color:var(--ink);
    border:1.5px solid rgba(180,140,105,.45);padding:6px 17px;border-radius:99px}
  #oBrand{position:absolute;left:0;right:0;top:730px;display:flex;flex-direction:column;align-items:center;
    opacity:0;will-change:transform,opacity}
  #oLogoBox{width:108px;height:108px;position:relative}
  #oBrand .o-name{margin-top:22px;font-size:33px;font-weight:900;letter-spacing:.02em;color:var(--ink)}
  #veil{position:absolute;inset:0;background:var(--cream);z-index:90;opacity:0;pointer-events:none}

  /* ===== 更新历史页（桌面端 / 安卓端两页） ===== */
  #history{position:absolute;inset:0;z-index:36;pointer-events:none;opacity:0}
  .h-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:280px}
  /* 桌面端 3 行 9 张，卡片区更高，上边距按整块居中调 */
  #hDesktop{padding-top:250px}
  #hAndroid{padding-top:360px}                       /* 安卓页只有一排卡片，整体下移居中 */
  .h-title{font-size:92px;font-weight:900;letter-spacing:.08em;text-indent:.08em;color:var(--ink);line-height:1.1;opacity:0}
  .h-plat{margin-top:16px;font-size:28px;font-weight:800;letter-spacing:.24em;text-indent:.24em;color:var(--caramel);opacity:0}
  /* 桌面端 12 张（4 行），行距与卡高按总高不超过 1080 收紧 */
  .h-cards{margin-top:56px;display:grid;grid-template-columns:repeat(3,540px);gap:24px 42px;justify-content:center}
  .h-card{position:relative;min-height:108px;border:1.5px solid rgba(180,140,105,.34);border-radius:18px;
    background:rgba(255,253,250,.55);padding:20px 24px 18px;opacity:0;will-change:transform,opacity;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
  /* 版本号直接排在卡片内部：原来靠 cream 底压在边框上遮断边框，半透明卡片上会露出一块白底 */
  .h-ver{display:block;margin-bottom:7px;font-size:19px;font-weight:800;letter-spacing:.05em;
    color:var(--caramel-d);line-height:1.2}
  /* 每张卡片控制在 2 行 / 20 字以内，文案直接改这里 */
  .h-desc{font-size:21px;font-weight:600;line-height:1.6;color:var(--ink-2)}
</style>
</head>
<body>
<div id="viewport">
  <div id="camera">
    <div id="stage">
      <div class="bg-warm"></div>
      <div class="bg-cloth"></div>

      <div id="heroLogo"><div id="heroLogoInner"><div class="logo-box" id="heroLogoBox">
        <!-- src 由 CONTENT.brand.logo 设置（见 renderBrand） -->
        <img alt="QookiX" />
      </div></div></div>
      <div id="brand"><span id="brandName">QookiX Launcher</span><span id="brandAppend">&nbsp;Android</span></div>
      <div id="brandSub">更新速览</div>

      <!-- 面板由 CONTENT.panels 生成（见脚本 renderPanels） -->
      <div id="panels"></div>

      <div id="screen">
        <div class="screen-card" id="screenCard">
          <div id="tMask"></div>
        </div>
      </div>

      <div id="outro">
        <!-- 结尾页由 CONTENT.outro 生成（见脚本 renderOutro） -->
        <div id="outroCols">
          <div id="outroText"></div>
          <div id="oRepos"></div>
        </div>
        <div id="oBrand">
          <div class="o-logo logo-box" id="oLogoBox"><img alt="QookiX" /></div>
          <div class="o-name">QookiX Launcher</div>
        </div>
      </div>

      <!-- ===== 更新历史：桌面端 / 安卓端两页，卡片从新到旧；版本号压在边框上 ===== -->
      <!-- 更新历史两页由 CONTENT.history 生成（见脚本 renderHistory） -->
      <div id="history"></div>

      <div id="sweep">
        <div class="sw"></div>
        <div class="sw"></div>
        <div class="sw"></div>
      </div>

      <div id="veil"></div>
    </div>
  </div>
</div>

<script>
/* ===== Logo 兜底占位 ===== */
const COOKIE_DOTS = [[24,30],[58,22],[38,52],[66,58],[20,66],[52,79]];
const cookiePHHTML = '<div class="ph-cookie">' +
  COOKIE_DOTS.map(d => `<i style="left:${d[0]}%;top:${d[1]}%"></i>`).join('') + '</div>';
function bindLogoFallback(box){
  const img = box.querySelector('img');
  box.insertAdjacentHTML('beforeend', cookiePHHTML);
  if (!img){ box.classList.add('missing'); return; }
  img.addEventListener('error', () => box.classList.add('missing'));
  if (img.complete && img.naturalWidth === 0) box.classList.add('missing');
}
/* 注意：logo 兜底的调用挪到内容渲染之后（见下方 render* 之后），
   因为结尾页的品牌块是由 CONTENT 生成的 */

/* ==== CONTENT:START ====
   下面这一段是「内容区」，由工具负责读写，其余代码不要动。
   shot.src 可以是相对路径，也可以是 data:image/...;base64,...（导出单文件时内联）
   shot.frame: desktop | phone-tall | phone-wide      shot.effect: null | scroll | mask
   ==== */
const CONTENT = {
  shots: {
    /* ===== 桌面端 · 本次更新亮点（目录 0.17.0） ===== */
    projection_library:{ src:'src/image/pc/0.17.0/projection_library.png', label:'拾木空间 · 投影库',       frame:'desktop' },
    projection_library2:{ src:'src/image/pc/0.17.0/projection_library2.png', label:'拾木空间 · 投影库（2）', frame:'desktop' },
    ui_dock:      { src:'src/image/pc/0.17.0/ui_dock.png',      label:'v0.16 · 底部 Dock 与启动按钮', frame:'desktop' },
    account_drawer:{ src:'src/image/pc/0.17.0/account_drawer.png', label:'v0.16 · 账号抽屉',    frame:'desktop' },
    time_machine: { src:'src/image/pc/0.17.0/time_machine.png', label:'时光机 · 世界快照一键恢复', frame:'desktop' },
    /* ===== 安卓端 · 横屏截图（目录 1.8.0） ===== */
    android_1:    { src:'src/image/phone/1.8.0/android_1.png',  label:'安卓版 · 主界面',       frame:'phone-wide' },
    android_2:    { src:'src/image/phone/1.8.0/android_2.png',  label:'安卓版 · 功能亮点',     frame:'phone-wide' },
    android_server:{ src:'src/image/phone/1.8.0/android_server.png', label:'手机托管服务器',   frame:'phone-wide' },
    android_localsend:{ src:'src/image/phone/1.8.0/android_localsend.png', label:'局域网同步（LocalSend）', frame:'phone-wide' },
    android_keylayout:{ src:'src/image/phone/1.8.0/android_keylayout.png', label:'触控按键布局编辑', frame:'phone-wide' }
  },
  /* 面板文案。顺序 = 时间轴里的出场顺序，条数不要随意改（时间轴按序号高亮） */
  panels: [
    { id:'panel-library',   title:'投影库',   items:['拾木空间','一键下载'] },
    { id:'panel-ui',        title:'全新界面', items:['底部 Dock','账号抽屉'] },
    { id:'panel-time',      title:'时光机',   items:['世界快照','一键恢复'] },
    { id:'panel-android',   title:'安卓版',   items:['全面升级','丝滑体验'] },
    { id:'panel-server',    title:'手机开服', items:['托管服务器','与电脑局域网同步'] },
    { id:'panel-control',   title:'按键布局', items:['按键布局编辑','导入导出分享'] }
  ],
  /* 更新历史：卡片从新到旧（桌面 9 张 / 安卓 6 张精选，避免溢出） */
  history: {
    desktop: { title:'更新历史', plat:'桌面端', cards:[
      { v:'v0.17.0', d:'LittleSkin OAuth2 免密授权登录' },
      { v:'v0.16.0', d:'界面重构：底部 Dock / 账号抽屉 / 一键启动' },
      { v:'v0.15.0', d:'投影加实例 + 拖拽导入 + 级联动画' },
      { v:'v0.14.0', d:'投影库板块筛选，官网 qookix.cn' },
      { v:'v0.13.0', d:'更新弹窗列出跨过的所有版本' },
      { v:'v0.12.0', d:'投影库 + 整合包拖拽 + 明暗切换' },
      { v:'v0.11.2', d:'时光机世界快照，一键恢复' },
      { v:'v0.11.1', d:'安装修复 + 侧边栏导航开关' },
      { v:'v0.11.0', d:'按键绑定可视化 + 时光机截图' }
    ]},
    android: { title:'更新历史', plat:'安卓端', cards:[
      { v:'v1.8.0', d:'游玩统计 / FRP 联机 / 内容翻译' },
      { v:'v1.7.4', d:'插件管理 / 实例分组 / 置顶' },
      { v:'v1.7.0', d:'前端 UI 完全重构' },
      { v:'v1.6.0', d:'内网穿透（MohuaFrp）' },
      { v:'v1.5.0', d:'整合包导入导出分享' },
      { v:'v1.4.0', d:'横屏 UI 适配' }
    ]}
  },
  /* 备注（画面左上角浮出来的小条）。字段：label 标题 / url 网址 / lic 协议。
     位置固定两处：repo* 是左边那一条（桌面段 / 安卓段展示不同仓库），transBackend 是翻译后端。
     整条删掉 = 那一处不显示。仓库已归入 QookiX 组织。 */
  annots: {
    repoDesktop:  { label:'开源地址',             url:'https://github.com/QookiX/QookiX-Launcher',           lic:'GPL-3.0' },
    repoAndroid:  { label:'开源地址',             url:'https://github.com/QookiX/QookiX-Launcher-Android',   lic:'GPL-3.0' },
    transBackend: { label:'翻译服务后端开源地址', url:'https://github.com/QookiX/QookiX-Translate-Platform', lic:'MIT' }
  },
  /* 结尾页 */
  outro: {
    lines: ['更多精彩','等你探索'],
    repos: [
      { tag:'桌面版',            url:'https://github.com/QookiX/QookiX-Launcher',            lic:'GPL-3.0', ver:'现已更新至 v0.17.0' },
      { tag:'安卓版',            url:'https://github.com/QookiX/QookiX-Launcher-Android',    lic:'GPL-3.0', ver:'现已更新至 v1.8.0' },
      { tag:'翻译服务 API 后端', url:'https://github.com/QookiX/QookiX-Translate-Platform',  lic:'MIT',     ver:'现已更新至 v1.0.0' },
      { tag:'QookiX 视频',       url:'https://github.com/QookiX/QookiX-Video',               lic:'GPL-3.0', ver:'' }
    ],
    brand: 'QookiX Launcher'
  },
  /* logo 两处（开场 + 结尾）共用；可换成 data:image/...（导出单文件时内联）*/
  brand: { name:'QookiX Launcher', append:'Android', sub:'更新速览', logo:'src/image/cookie_logo.png' }
};
/* ==== CONTENT:END ==== */

/* ===== 截图清单：由 CONTENT.shots 生成 ===== */
const screenCard = document.getElementById('screenCard');
const SHOTS = Object.keys(CONTENT.shots).map(id => Object.assign({ id }, CONTENT.shots[id]));
const SHOT = {};
SHOTS.forEach(s => {
  const phone = (s.frame || 'desktop') !== 'desktop';
  const wrap = document.createElement('div');
  wrap.className = 'shot ' + (phone ? 'phone' : 'desktop') + (s.effect === 'scroll' ? ' scroll' : '');
  wrap.dataset.shot = s.id;
  wrap.dataset.frame = s.frame || 'desktop';
  /* 用同一张图给本层铺底：截图自带的透明/阴影边露出时，看到的是图片自身的延伸，不会出现缝 */
  wrap.style.backgroundImage = 'url("' + s.src + '")';
  const phName = s.src.startsWith('data:') ? (s.label || '图片') : s.src.split('/').pop();
  const inner =
    `<img src="${s.src}" alt="${s.label}" />` +
    `<div class="ph"><div class="ph-skel"></div>` +
    `<div class="ph-name">${phName}</div>` +
    `<div class="ph-desc">${s.label}</div></div>`;
  wrap.innerHTML = inner;
  const img = wrap.querySelector('img');
  img.addEventListener('error', () => wrap.classList.add('missing'));
  if (img.complete && img.naturalWidth === 0) wrap.classList.add('missing');
  screenCard.insertBefore(wrap, document.getElementById('tMask'));
  SHOT[s.id] = wrap;
});

/* ===== 内容渲染：把 CONTENT 写进 DOM。必须在建时间轴之前跑完 ===== */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPanels(){
  document.getElementById('panels').innerHTML = CONTENT.panels.map(p => {
    const listId = p.id.replace(/^panel-/, 'list-');
    return '<section class="panel" id="' + esc(p.id) + '">' +
      '<h2 class="p-title">' + esc(p.title) + '</h2>' +
      '<ul class="p-list" id="' + esc(listId) + '">' +
      p.items.map(t => '<li class="item"><span class="txt">' + esc(t) + '</span></li>').join('') +
      '</ul></section>';
  }).join('');
}

function renderAnnots(){
  const card = document.getElementById('screenCard');
  card.querySelectorAll('.annot').forEach(n => n.remove());
  /* 追加到 screenCard 末尾（即 #tMask 之后），和改造前的静态 DOM 顺序一致。
     .annot 的 z-index(12) 比 #tMask(9) 高，位置本来就不受影响，
     但顺序一致，逐帧回归的 diff 才读得懂。 */
  const build = (domId, a) => {
    if (!a || !a.url) return;                      /* 空 = 这一处不显示 */
    const d = document.createElement('div');
    d.id = domId; d.className = 'annot';
    d.innerHTML = '<div class="annot-h">' + esc(a.label) + '</div>' +
      '<a class="annot-url" href="' + esc(a.url) + '" target="_blank">' + esc(a.url) + '</a>' +
      '<span class="annot-lic">' + esc(a.lic) + '</span>';
    card.append(d);
  };
  build('annotRepo',  CONTENT.annots.repoDesktop);
  build('annotTrans', CONTENT.annots.transBackend);
}

/* ===== 镜头焦点式高亮 ===== */
function hl(list, idx){
  const t = gsap.timeline();
  list.forEach((el, i) => {
    const on = i === idx;
    t.to(el, on ? {
      color:'#C98858', opacity:1, filter:'blur(0px)', scale:1.15, x:22,
      duration:0.55, ease:'back.out(2)'
    } : {
      color:'#C9B6A5', opacity:0.42, filter:'blur(1.2px)', scale:1, x:0,
      duration:0.46, ease:'power2.out'
    }, 0);
  });
  return t;
}
function panelIn(id, time){
  tl.fromTo('#'+id, { opacity:0, y:48 }, { opacity:1, y:0, duration:0.68, ease:'power3.out' }, time);
}
function panelOut(id, time){
  tl.to('#'+id, { opacity:0, y:-42, duration:0.48, ease:'power2.in' }, time);
}

/* ===== 截图左右推入 + 物理反馈 ===== */
/* 手机 / 桌面两种容器形态：手机类截图时窗口缩成手机大小 */
/* 容器形态改成「每张截图自己声明」，不再用全局开关：
     shot.frame = desktop | phone-tall | phone-wide（数据见 CONTENT.shots）
   CSS 里 #screen 的初始 left/top/width/height 与下面 phone-wide 保持一致（当前安卓侧为横屏）。 */
const FRAME_SIZE = {
  'desktop':    { left:548, top:107, width:1330, height:866 },
  'phone-tall': { left:990, top:70,  width:440,  height:940 },
  'phone-wide': { left:658, top:287, width:1105, height:506 }
};
const SIZE_PHONE = FRAME_SIZE['phone-wide'];   /* 时间轴起始形态（首屏是横屏手机） */
function frameOf(id){
  const w = SHOT[id];
  const f = (w && w.dataset.frame) || 'desktop';
  return FRAME_SIZE[f] ? f : 'desktop';
}
function frameSize(id){ return FRAME_SIZE[frameOf(id)]; }
const CARD_PHONE = { border:'10px solid #241C16', backgroundColor:'#0d1117', boxShadow:'0px 0px 0px rgba(0,0,0,0)' };
const CARD_DESK  = { border:'10px solid #241C16', backgroundColor:'#0d1117',
                     boxShadow:'0px 0px 0px rgba(0,0,0,0)' };
function swap(outIds, inId, time, dur, quiet){
  dur = dur || 0.72;
  const outs = outIds.filter(Boolean).map(id => SHOT[id]);
  const phone = frameOf(inId) !== 'desktop';
  tl.to(SCREEN, Object.assign({ duration:dur, ease:'power3.inOut' }, frameSize(inId)), time);
  tl.to('#screenCard', Object.assign({ duration:0.4, ease:'power2.out' }, phone ? CARD_PHONE : CARD_DESK), time);
  if (outs.length) tl.to(outs, { xPercent:-100, duration:dur, ease:'power3.inOut' }, time);
  tl.fromTo(SHOT[inId],
    { xPercent:100, opacity:1, clipPath:'inset(0 0 0 0)' },
    { xPercent:0,  opacity:1, clipPath:'inset(0 0 0 0)', duration:dur, ease:'power3.inOut' }, time);
  /* 长图：从顶滚动到底，前后慢中间快 */
  if (SHOT[inId].classList.contains('scroll')) {
    const imgEl = SHOT[inId].querySelector('img');
    tl.fromTo(imgEl, { y:0 },
      { y: () => -Math.max(0, imgEl.offsetHeight - SHOT[inId].clientHeight), duration:2.7, ease:'power2.inOut' },
      time + 0.35);
  }
}

/* ===== 长图首屏：未经 swap 带入时需单独挂滚动 ===== */
function scrollShot(id, t){
  const el = SHOT[id];
  if (!el || !el.classList.contains('scroll')) return;
  const imgEl = el.querySelector('img');
  tl.fromTo(imgEl, { y:0 },
    { y: () => -Math.max(0, imgEl.offsetHeight - el.clientHeight), duration:2.7, ease:'power2.inOut' }, t);
}

/* ===== 翻译遮罩切换：英文在上，斜向遮罩扫过揭示底层中文 ===== */
function maskReveal(id_zh, t){
  const en = SHOT['translate_en'];
  const zh = SHOT[id_zh];
  /* 必须写进时间轴，否则循环第二轮起会失效 */
  tl.set(zh, { xPercent:0, opacity:1, clipPath:'inset(0 0 0 0)', zIndex:4 }, t - 0.01);
  tl.set(en, { xPercent:0, opacity:1, clipPath:'inset(0 0 0 0)', zIndex:5 }, t - 0.01);
  /* 遮罩从左扫到右，英文从左侧被裁掉 → 露出底层中文 */
  tl.fromTo(en, { clipPath:'inset(0 0 0 0)' }, { clipPath:'inset(0 0 0 100%)', duration:0.55, ease:'power2.inOut' }, t);
  tl.fromTo('#tMask', { left:'-42%', opacity:0.95 }, { left:'112%', opacity:0.95, duration:0.55, ease:'power2.inOut' }, t);
  tl.set('#tMask', { opacity:0 }, t + 0.55);
}

/* ===== 斜向切片转场 ===== */
const SW_DUR = 0.25, SW_HOLD = 0.12, SW_STAG = 0.045;
function sweep(t){
  const s = gsap.timeline();
  /* 三片用同一段行程，避免离场时片间拉开缝隙露底 */
  const enter = -3200, exit = 3200;
  s.set(swEls, { x: enter });
  s.to(swEls, { x:0, duration:SW_DUR, ease:'power2.out', stagger:SW_STAG }, 0);
  s.to(swEls, { x:exit, duration:SW_DUR, ease:'power2.in', stagger:SW_STAG }, SW_DUR + SW_HOLD);
  tl.add(s, t);
}

tl.to('#hDesktop .h-title', { opacity:0, duration:0.40, ease:'power2.in' }, 45.75);
tl.to('#hAndroid .h-card', { opacity:0, y:-26, duration:0.40, ease:'power2.in', stagger:0.05 }, 45.65);

/* ===== 结尾落脚（无转场，安卓卡片淡出后直接进）：左标题 / 右仓库地址 / 下品牌 ===== */
tl.fromTo('#o1', { opacity:0, y:70 }, { opacity:1, y:0, duration:0.8, ease:'back.out(1.6)' }, 46.25);
tl.fromTo('#o2', { opacity:0, y:70 }, { opacity:1, y:0, duration:0.8, ease:'back.out(1.6)' }, 46.75);
tl.fromTo('#oRepos', { opacity:0, y:34 }, { opacity:1, y:0, duration:0.7, ease:'power3.out' }, 46.95);
/* 版本号卡片依次向下展开 */
tl.to('.o-ver', { height:'auto', opacity:1, marginTop:7, duration:0.45, ease:'power2.out', stagger:0.14 }, 47.60);
tl.fromTo('#oBrand', { opacity:0, y:44 }, { opacity:1, y:0, duration:0.75, ease:'power3.out' }, 48.50);
tl.fromTo('#oLogoBox', { scale:0.5, rotate:-14 }, { scale:1, rotate:0, duration:0.9, ease:'back.out(2)' }, 48.50);
tl.to('#veil', { opacity:1, duration:0.38, ease:'none' }, 51.17);
tl.to({ _:0 }, { _:1, duration:0.001 }, 51.55);

/* ===== 播放 ===== */
let started = false;
function start(){ if (started) return; started = true; tl.play(0); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
window.addEventListener('load', start);
setTimeout(start, 1200);
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); tl.paused() ? tl.play() : tl.pause(); }
  if (e.code === 'KeyR'){ tl.play(0); }
});

/* ===== 深链：index.html?t=12.3 跳到第 12.3 秒并停住（不带参数行为完全不变） =====
   工具预览、回归截图、以及「把这个瞬间发给别人」都用它。
   seek 传 suppressEvents=false，好让时间轴里的 .call()（切换备注数据）生效。 */
(function(){
  const q = new URLSearchParams(location.search);
  if (!q.has('t')) return;
  const at = parseFloat(q.get('t'));
  if (!isFinite(at)) return;
  started = true;                       /* 拦掉自动播放与 fonts.ready 的补播 */
  tl.pause();
  window.addEventListener('load', () => tl.seek(at, false));
})();
</script>
